<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--c0:#04060e;--c1:#080b16;--c2:#0c1020;--bd:rgba(255,255,255,.1);--t1:#dde3f0;--t2:#7a8ba8;--pu:#a78bfa;--cy:#22d3ee;--up:#0ecf7e;--dn:#f04458}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--c0);color:var(--t1);font-family:'IBM Plex Sans Arabic',sans-serif}
.top{height:50px;background:linear-gradient(180deg,#0a0e1a,var(--c1));border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:20px;flex-shrink:0}
.logo{font-size:16px;font-weight:700;color:var(--pu)}
.search{flex:1;max-width:300px}
.search input{width:100%;padding:8px 12px;background:var(--c2);border:1px solid var(--bd);border-radius:4px;color:var(--t1);font-family:inherit}
.search input::placeholder{color:var(--t2)}
.main{display:flex;flex:1;min-height:0;gap:10px;padding:10px}
.sidebar{width:280px;background:var(--c1);border:1px solid var(--bd);border-radius:6px;overflow:auto;padding:10px}
.stocks-list{display:flex;flex-direction:column;gap:8px}
.stock-item{padding:10px;background:var(--c2);border-left:3px solid var(--pu);border-radius:4px;cursor:pointer;transition:all .2s;font-size:12px}
.stock-item:hover{background:#111628;border-left-color:var(--cy)}
.stock-name{font-weight:600;color:var(--t1);margin-bottom:3px}
.stock-price{color:var(--t2);font-size:11px}
.chart-panel{flex:1;background:var(--c1);border:1px solid var(--bd);border-radius:6px;padding:15px;overflow:auto}
.chart-title{font-size:14px;font-weight:600;color:var(--pu);margin-bottom:10px}
.chart-container{height:300px;margin-bottom:20px}
.prediction-table{width:100%;font-size:11px;border-collapse:collapse}
.prediction-table th{background:var(--c2);padding:8px;text-align:center;font-weight:600;color:var(--t2);border-bottom:1px solid var(--bd)}
.prediction-table td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.loading{text-align:center;padding:20px;color:var(--t2)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--pu);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div class="top">
  <div class="logo">⚡ TADAWUL FILTERS PRO AI</div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="ابحث عن سهم...">
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div style="font-size:12px;color:var(--t2);margin-bottom:10px;font-weight:600">أشهر الأسهم</div>
    <div id="stocksList" class="stocks-list">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top:10px;font-size:11px">جاري تحميل الأسهم...</p>
      </div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="chart-title" id="chartTitle">اختر سهم لعرض التنبؤ</div>
    <div class="chart-container">

</div>

let currentStock = null;
let chart = null;

// تحميل قائمة الأسهم
function loadStocks() {
  const container = document.getElementById('stocksList');
  container.innerHTML = stocks.map(stock => `
    <div class="stock-item" onclick="selectStock('${stock.symbol}', '${stock.name}', ${stock.price})">
      <div class="stock-name">${stock.name}</div>
      <div class="stock-price">${stock.symbol} - ${stock.price.toFixed(2)} ر.س</div>
    </div>
  `).join('');
}

// تحديد سهم
function selectStock(symbol, name, price) {
  currentStock = { symbol, name, price };
  document.getElementById('chartTitle').textContent = `📈 ${name} (${symbol})`;
  
  // تحديث البيانات والتنبؤات
  generatePredictions(price);
  updateChart();
  updatePredictionTable();
}

// توليد التنبؤات
function generatePredictions(basePrice) {
  const predictions = [];
  let price = basePrice;
  
  for (let i = 1; i <= 15; i++) {
    // محاكاة حركة السعر مع اتجاه عشوائي
    const change = (Math.random() - 0.48) * 2; // اتجاه عشوائي
    price = price * (1 + change / 100);
    
    // حساب الثقة
    const confidence = 80 - (i * 3); // تقل الثقة مع الوقت
    
    predictions.push({
      period: i,
      price: Math.max(basePrice * 0.8, price),
      confidence: Math.max(20, confidence),
      change: ((price - basePrice) / basePrice * 100).toFixed(2)
    });
  }
  
  currentStock.predictions = predictions;
}

// تحديث الرسم البياني
function updateChart() {
  if (!currentStock) return;
  
  const ctx = document.getElementById('predictionChart').getContext('2d');
  
  if (chart) chart.destroy();
  
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: currentStock.predictions.map(p => `${p.period}`),
      datasets: [{
        label: 'السعر المتنبأ',
        data: currentStock.predictions.map(p => p.price),
        borderColor: '#a78bfa',
        backgroundColor: 'rgba(167, 139, 250, 0.1)',
        borderWidth: 2,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#a78bfa'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#7a8ba8', font: { size: 11 } } }
      },
      scales: {
        x: { ticks: { color: '#7a8ba8' }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#7a8ba8' }, grid: { color: 'rgba(255,255,255,.05)' } }
      }
    }
  });
}

// تحديث جدول التنبؤات
function updatePredictionTable() {
  if (!currentStock) return;
  
  const tbody = document.querySelector('.prediction-table tbody');
  tbody.innerHTML = currentStock.predictions.slice(0, 10).map(p => `
    <tr>
      <td>${p.period}</td>
      <td style="color:var(--cy);font-weight:600">${p.price.toFixed(2)}</td>
      <td style="color:${p.confidence > 60 ? '#0ecf7e' : p.confidence > 40 ? '#f5c842' : '#f04458'}">${p.confidence.toFixed(0)}%</td>
      <td style="color:${p.change > 0 ? '#0ecf7e' : '#f04458'}">${p.change}%</td>
    </tr>
  `).join('');
}

// البحث عن أسهم
document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = stocks.filter(s => 
    s.name.includes(query) || s.symbol.includes(query)
  );
  
  const container = document.getElementById('stocksList');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="loading" style="color:var(--t2)">لم يتم العثور على أسهم</div>';
  } else {
    container.innerHTML = filtered.map(stock => `
      <div class="stock-item" onclick="selectStock('${stock.symbol}', '${stock.name}', ${stock.price})">
        <div class="stock-name">${stock.name}</div>
        <div class="stock-price">${stock.symbol} - ${stock.price.toFixed(2)} ر.س</div>
      </div>
    `).join('');
  }
});

// تحميل البيانات عند الفتح
window.addEventListener('load', () => {
  loadStocks();
  // اختر أول سهم تلقائياً
  setTimeout(() => {
    const firstStock = stocks[0];
    selectStock(firstStock.symbol, firstStock.name, firstStock.price);
  }, 500);
});
